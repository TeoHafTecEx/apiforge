[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apiforge"
version = "0.5.0"
description = "Point at a website, get an API you can run as a KNIME service."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "openai>=1.40",
  "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2", "pyyaml>=6"]

[project.scripts]
apiforge = "apiforge.cli:main"

[tool.setuptools]
packages = ["apiforge"]

[tool.setuptools.package-data]
apiforge = ["templates/*"]
