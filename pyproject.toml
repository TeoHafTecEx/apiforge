[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apiforge"
version = "0.4.0"
description = "Browse a website once, get a deployable REST API for it."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "openai>=1.40",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apiforge = "apiforge.cli:main"

[tool.setuptools]
packages = ["apiforge"]

[tool.setuptools.package-data]
apiforge = ["templates/*", "templates/.dockerignore", "static/*"]
